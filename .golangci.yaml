# =============================================================================
# golangci-lint configuration
# Built by Statick | https://statick.dev
# =============================================================================

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused
    - gofmt
    - goimports
    - misspell
    - unconvert
    - unparam
    - gocritic
    - gochecknoinits
    - goconst
    - gocyclo
    - godot
    - gofmt
    - goimports
    - revive
    - whitespace

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
  gocyclo:
    min-complexity: 15
  goconst:
    min-len: 2
    min-occurrences: 2
  govet:
    check-shadowing: true
  gofmt:
    simplify: true
  goimports:
    local-prefixes: github.com/statick/tap-support
  misspell:
    locale: US
  revive:
    rules:
      - name: var-naming
        severity: warning
      - name: var-declaration
        severity: warning
      - name: package-naming
        severity: warning
  gocritic:
    disabled-checks:
      - commentFormat

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - gosec
    - path: internal/infrastructure/tiktok/
      linters:
        - gosec
    - text: "shadow declaration"
      linters:
        - govet
      severity: warning